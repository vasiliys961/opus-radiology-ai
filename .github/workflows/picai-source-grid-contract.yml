name: PI-CAI original MRI preparation contract
on:
  pull_request:
    paths:
      - scripts/prepare-original-picai-mha.py
      - scripts/run-original-automsc-picai.py
      - .github/workflows/picai-source-grid-contract.yml
permissions:
  contents: read
jobs:
  prepare-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/prepare-original-picai-mha.py scripts/run-original-automsc-picai.py
