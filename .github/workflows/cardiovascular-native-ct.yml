name: Cardiovascular CT source-native quantitative evidence
on:
  pull_request:
    paths:
      - scripts/real-cardiovascular-anatomy-native-ct.py
      - scripts/test-real-cardiovascular-anatomy-native-ct.py
      - .github/workflows/cardiovascular-native-ct.yml
  push:
    branches: [main]
    paths:
      - scripts/real-cardiovascular-anatomy-native-ct.py
      - scripts/test-real-cardiovascular-anatomy-native-ct.py
      - .github/workflows/cardiovascular-native-ct.yml
permissions:
  contents: read
jobs:
  clinical-geometry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Numerical dependencies (no Torch/GPU/downloaded scans)
        run: python -m pip install 'numpy==1.26.4' 'nibabel==5.3.2'
      - name: Source-native geometrical test and fail-closed checks
        run: python -m unittest discover -s scripts -p 'test-real-cardiovascular-anatomy-native-ct.py'
