name: TotalSpineSeg original two-stage MRI discs and cord research
on:
  pull_request:
    paths:
      - scripts/real-totalspineseg-disc-cord-mri-cpu.py
      - scripts/test-real-totalspineseg-disc-cord-mri-cpu.py
      - .github/workflows/totalspineseg-original-disc-cpu.yml
  push:
    branches: [main]
    paths:
      - scripts/real-totalspineseg-disc-cord-mri-cpu.py
      - scripts/test-real-totalspineseg-disc-cord-mri-cpu.py
      - .github/workflows/totalspineseg-original-disc-cpu.yml
permissions:
  contents: read
jobs:
  original-spine-ontology-source-and-license-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'numpy==1.26.4' 'nibabel==5.3.2'
      - run: python3 -m unittest discover -s scripts -p 'test-real-totalspineseg-disc-cord-mri-cpu.py'
