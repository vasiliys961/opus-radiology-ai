name: Real R231 public reference (manual)

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Public browser reference coverage (not clinical/M1 acceptance)
        type: choice
        options: [partial, full]
        default: partial

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install opt-in CPU stack
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/imaging-ai/requirements-lungmask.txt -r services/imaging-ai/requirements-dev.txt
          python -m pip check
      - name: Explicit research checkpoint install
        run: python scripts/install-r231.py --output "$RUNNER_TEMP/r231.pth" --accept-research-license
      - name: Real acknowledged-chunk HTTP inference on authors' two-slice CT fixture
        run: python scripts/test-real-r231.py --weights "$RUNNER_TEMP/r231.pth" --download-public-reference --http-worker --chunked-upload --report "$RUNNER_TEMP/r231-reference.json"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare browser runtime
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          NEXT_TELEMETRY_DISABLED=1 npm run build
          npx playwright install --with-deps chromium
      - name: Actual R231 public browser reference (declared coverage, not M1 acceptance)
        env:
          REFERENCE_COVERAGE: ${{ inputs.coverage }}
        run: |
          reference_options=()
          if [[ "$REFERENCE_COVERAGE" == "full" ]]; then reference_options+=(--full-series); fi
          python scripts/download-r231-browser-reference.py --download-public-reference --output "$RUNNER_TEMP/lctsc-reference" "${reference_options[@]}"
          node scripts/check-r231-browser.mjs --python "$(command -v python)" --weights "$RUNNER_TEMP/r231.pth" --reference "$RUNNER_TEMP/lctsc-reference" --report "$RUNNER_TEMP/r231-browser.json" "${reference_options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: r231-engineering-metrics-no-images
          path: |
            ${{ runner.temp }}/r231-reference.json
            ${{ runner.temp }}/r231-browser.json
          retention-days: 7
