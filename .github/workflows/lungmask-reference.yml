name: Real R231 public reference (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install opt-in CPU stack
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r services/imaging-ai/requirements-lungmask.txt -r services/imaging-ai/requirements-dev.txt
          python -m pip check
      - name: Explicit research checkpoint install
        run: python scripts/install-r231.py --output "$RUNNER_TEMP/r231.pth" --accept-research-license
      - name: Real acknowledged-chunk HTTP inference on authors' two-slice CT fixture
        run: python scripts/test-real-r231.py --weights "$RUNNER_TEMP/r231.pth" --download-public-reference --http-worker --chunked-upload --report "$RUNNER_TEMP/r231-reference.json"
      - uses: actions/upload-artifact@v4
        with:
          name: r231-engineering-metrics-no-images
          path: ${{ runner.temp }}/r231-reference.json
          retention-days: 7
