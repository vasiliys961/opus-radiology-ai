name: Browser uploaded MONAI source integration
on:
  pull_request:
    paths:
      - "services/imaging-ai/monai_nodule_upload_worker.py"
      - "services/imaging-ai/test_monai_nodule_upload_worker.py"
      - "web/lib/live-nodule-worker.ts"
      - "web/lib/live-nodule-worker.test.ts"
      - "web/components/NoduleBoundResearchView.tsx"
      - ".github/workflows/monai-browser-source-upload.yml"
  push:
    paths:
      - "services/imaging-ai/monai_nodule_upload_worker.py"
      - "services/imaging-ai/test_monai_nodule_upload_worker.py"
      - "web/lib/live-nodule-worker.ts"
      - "web/lib/live-nodule-worker.test.ts"
      - "web/components/NoduleBoundResearchView.tsx"
      - ".github/workflows/monai-browser-source-upload.yml"
permissions:
  contents: read
jobs:
  browser-to-private-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.2.6 fastapi==0.115.12 httpx==0.28.1 psutil==6.1.1
      - run: |
          python -m py_compile services/imaging-ai/monai_nodule_upload_worker.py services/imaging-ai/test_monai_nodule_upload_worker.py
          python services/imaging-ai/test_monai_nodule_upload_worker.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm ci && npm run typecheck && node --experimental-strip-types --test lib/live-nodule-worker.test.ts
