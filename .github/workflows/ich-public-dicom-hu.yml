name: ICH public original DICOM to HU NIfTI (nonpatient contracts)
on:
  pull_request:
    paths:
      - "scripts/prepare-ich-public-dicom-hu.py"
      - "scripts/test-prepare-ich-public-dicom-hu.py"
      - "scripts/run-public-ich-dicom-evidence.py"
      - "scripts/test-run-public-ich-dicom-evidence.py"
      - "scripts/test-ich-public-loopback-worker.py"
      - "services/imaging-ai/ich_public_worker.py"
      - ".github/workflows/ich-public-dicom-hu.yml"
  push:
    paths:
      - "scripts/prepare-ich-public-dicom-hu.py"
      - "scripts/test-prepare-ich-public-dicom-hu.py"
      - "scripts/run-public-ich-dicom-evidence.py"
      - "scripts/test-run-public-ich-dicom-evidence.py"
      - "scripts/test-ich-public-loopback-worker.py"
      - "services/imaging-ai/ich_public_worker.py"
      - ".github/workflows/ich-public-dicom-hu.yml"
permissions:
  contents: read
jobs:
  geometry-and-hu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir "numpy==2.2.6" "nibabel==5.3.2" "pydicom==3.0.1" "fastapi==0.115.12" "psutil==6.1.1"
      - run: python -m py_compile scripts/prepare-ich-public-dicom-hu.py scripts/test-prepare-ich-public-dicom-hu.py scripts/run-public-ich-dicom-evidence.py scripts/test-run-public-ich-dicom-evidence.py services/imaging-ai/ich_public_worker.py scripts/test-ich-public-loopback-worker.py
      - run: python scripts/test-prepare-ich-public-dicom-hu.py
      - run: python scripts/test-run-public-ich-dicom-evidence.py
      - run: python scripts/test-ich-public-loopback-worker.py
