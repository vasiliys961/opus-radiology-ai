name: AutoMSC PICAI native inference contract
on:
  pull_request:
    paths:
      - scripts/run-original-automsc-picai.py
      - docs/AUTOMSC_PICAI_ORIGINAL_INFERENCE.md
      - .github/workflows/automsc-picai-inference-contract.yml
permissions:
  contents: read
jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile real original-model entry point
        run: python -m py_compile scripts/run-original-automsc-picai.py
      - name: Confirm callable research CLI
        run: python scripts/run-original-automsc-picai.py --help
