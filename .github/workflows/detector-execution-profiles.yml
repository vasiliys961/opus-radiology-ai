name: Detector execution profiles
on:
  pull_request:
    paths:
      - services/imaging-ai/detector_profiles.py
      - .github/workflows/detector-execution-profiles.yml
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile services/imaging-ai/detector_profiles.py
      - run: python services/imaging-ai/detector_profiles.py
