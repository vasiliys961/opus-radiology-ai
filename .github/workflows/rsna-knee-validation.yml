name: Knee validation contract
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_validation.py'
      - 'services/imaging-ai/test_rsna_knee_validation.py'
      - '.github/workflows/rsna-knee-validation.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy scikit-learn
      - run: |
          python -m py_compile services/imaging-ai/rsna_knee_validation.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_validation.py' -v
