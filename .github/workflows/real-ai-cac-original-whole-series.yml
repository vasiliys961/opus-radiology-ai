name: Genuine AI-CAC full 103-slice original TCIA CT inference
on:
  push:
    branches:
      - research/ai-cac-real-whole-native-ct-103
    paths:
      - scripts/real-ai-cac-lctsc-technical-smoke.py
      - scripts/download-ai-cac-known-lctsc.py
      - .github/workflows/real-ai-cac-original-whole-series.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-one-slice-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check host physical and container memory limits
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          print("Host Memory:",next(x for x in Path("/proc/meminfo").read_text().splitlines() if x.startswith("MemTotal:")))
          p=Path("/sys/fs/cgroup/memory.max")
          print("cgroup memory:",p.read_text().strip() if p.is_file() else "unknown")
          print("Disk GiB free:",round(shutil.disk_usage("/tmp").free/2**30,2))
          assert shutil.disk_usage("/tmp").free >= 5*2**30
          PY
      - name: Install original research inference framework in isolated runner
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir "torch==2.6.0" "torchvision==0.21.0" \
             --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "monai==1.4.0" "numpy==1.26.4" \
             "pydicom==2.4.4" "scipy==1.15.3" "nibabel==5.3.2" "einops==0.8.1"
      - name: Direct official public TCIA LCTSC 103 original DICOM using pinned SHA chain
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 700s \
            python scripts/download-ai-cac-known-lctsc.py \
              --output "$RUNNER_TEMP/opus-original-lctsc"
      - name: Fetch genuine AI-CAC 1.2GB published checkpoint with pinned SHA256
        run: |
          timeout --signal=TERM --kill-after=20s 850s \
            python scripts/real-ai-cac-public-ct.py \
              --mode fetch-weights --model-dir "$RUNNER_TEMP/opus-original-ai-cac" \
              --public-research-consent
      - name: Genuine original pretrained AI-CAC inference on all original 103 CT slices
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 950s \
            python scripts/real-ai-cac-lctsc-technical-smoke.py --whole \
              --source "$RUNNER_TEMP/opus-original-lctsc" \
              --models "$RUNNER_TEMP/opus-original-ai-cac" \
              --output /tmp/opus-ai-cac-real-full-ct-numeric.json
      - name: Upload numeric technical evidence only (no scans/UIDs/predicted masks)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-cac-original-full-ct-real-numeric
          path: /tmp/opus-ai-cac-real-full-ct-numeric.json
          if-no-files-found: error
          retention-days: 7
      - name: Erase source DICOM, weights and ephemeral metrics
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/opus-original-lctsc" \
                 "$RUNNER_TEMP/opus-original-ai-cac" \
                 /tmp/opus-ai-cac-real-full-ct-numeric.json
