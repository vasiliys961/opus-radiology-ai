name: RSNA knee research contract
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee.py'
      - 'services/imaging-ai/test_rsna_knee.py'
      - '.github/workflows/rsna-knee-contract.yml'
  workflow_dispatch:
jobs:
  knee-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run contract tests (no patient data / no GPU)
        run: |
          python -m py_compile services/imaging-ai/rsna_knee.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee.py' -v
