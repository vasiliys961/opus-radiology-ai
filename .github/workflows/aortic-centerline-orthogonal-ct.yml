name: Aorta original CT centerline orthogonal 3D research
on:
  pull_request:
    paths:
      - scripts/real-aortic-centerline-orthogonal-ct.py
      - scripts/test-real-aortic-centerline-orthogonal-ct.py
      - .github/workflows/aortic-centerline-orthogonal-ct.yml
  push:
    branches: [main]
    paths:
      - scripts/real-aortic-centerline-orthogonal-ct.py
      - scripts/test-real-aortic-centerline-orthogonal-ct.py
      - .github/workflows/aortic-centerline-orthogonal-ct.yml
permissions:
  contents: read
jobs:
  true-original-physical-mask-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'numpy==1.26.4' 'scipy==1.15.3' 'nibabel==5.3.2'
      - run: python3 -m unittest discover -s scripts -p 'test-real-aortic-centerline-orthogonal-ct.py'
