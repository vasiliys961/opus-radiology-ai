name: ICH expert-mask comparison checks

on:
  pull_request:
    paths:
      - "scripts/evaluate-ich-public-mask.py"
      - "scripts/test-ich-public-mask.py"
      - "scripts/ich-native-slice-evidence.py"
      - "scripts/test-ich-native-slice-evidence.py"
      - "scripts/ich-expert-component-contact.py"
      - "scripts/test-ich-expert-component-contact.py"
      - "scripts/build-ich-expert-binary-union.py"
      - "scripts/test-ich-expert-binary-union.py"
      - ".github/workflows/ich-reference-comparison.yml"
  push:
    paths:
      - "scripts/evaluate-ich-public-mask.py"
      - "scripts/test-ich-public-mask.py"
      - "scripts/ich-native-slice-evidence.py"
      - "scripts/test-ich-native-slice-evidence.py"
      - "scripts/ich-expert-component-contact.py"
      - "scripts/test-ich-expert-component-contact.py"
      - "scripts/build-ich-expert-binary-union.py"
      - "scripts/test-ich-expert-binary-union.py"
      - ".github/workflows/ich-reference-comparison.yml"

permissions:
  contents: read

jobs:
  expert-mask-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline-evaluator math dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.2.6 scipy==1.15.3 nibabel==5.3.2
      - name: Evaluate numeric mask comparison contracts
        run: python scripts/test-ich-public-mask.py
      - name: Check source-indexed hemorrhage slice evidence
        run: python scripts/test-ich-native-slice-evidence.py
      - name: Score connected 3D expert mask fragments
        run: python scripts/test-ich-expert-component-contact.py
      - name: Preserve only source-documented hemorrhage labels in binary expert union
        run: python scripts/test-ich-expert-binary-union.py
