name: PanCancer original lung and kidney tumor executor contract
on:
  pull_request:
    paths:
      - scripts/pancancer_lung_kidney_research.py
      - scripts/test_pancancer_lung_kidney_research.py
      - docs/PANCANCER_LUNG_KIDNEY_RESEARCH.md
      - .github/workflows/pancancer-lung-kidney-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Only light numeric packages; NO 64GB actual pretrained forward
        run: python -m pip install 'numpy==2.2.6' 'scipy==1.15.3' 'nibabel==5.3.2'
      - name: Original lung/kidney 3D source/weights ontology and research-only evidence
        run: |
          python -m py_compile scripts/pancancer_lung_kidney_research.py scripts/test_pancancer_lung_kidney_research.py
          python -m unittest discover -s scripts -p 'test_pancancer_lung_kidney_research.py' -v
          python scripts/pancancer_lung_kidney_research.py --help | grep -- --execute
