name: Original L1 vertebra CT trabecular attenuation research
on:
  pull_request:
    paths:
      - scripts/measure-original-l1-trabecular-ct-hu.py
      - scripts/test-measure-original-l1-trabecular-ct-hu.py
      - .github/workflows/l1-original-trabecular-ct-hu.yml
permissions:
  contents: read
jobs:
  source-bound-l1-ct-hu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6' 'nibabel==5.3.2'
      - run: python -m unittest discover -s scripts -p 'test-measure-original-l1-trabecular-ct-hu.py' -v
