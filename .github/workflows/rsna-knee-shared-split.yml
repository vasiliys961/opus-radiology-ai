name: Knee shared validation and prediction contract
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_dinov2.py'
      - 'services/imaging-ai/rsna_knee_coatnet.py'
      - 'services/imaging-ai/rsna_knee_validation.py'
      - 'services/imaging-ai/test_rsna_knee_shared_split.py'
      - '.github/workflows/rsna-knee-shared-split.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline structural and split contract
        run: |
          python -m py_compile services/imaging-ai/rsna_knee_dinov2.py services/imaging-ai/rsna_knee_coatnet.py services/imaging-ai/rsna_knee_validation.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_shared_split.py' -v
