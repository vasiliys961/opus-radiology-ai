name: Python AI requirements

on:
  push:
    paths:
      - "requirements.txt"
      - "services/imaging-ai/**"
      - "scripts/*r231*"
      - "scripts/start-local-lungmask.sh"
      - ".github/workflows/requirements-checks.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "services/imaging-ai/**"
      - "scripts/*r231*"
      - "scripts/start-local-lungmask.sh"
      - ".github/workflows/requirements-checks.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r services/imaging-ai/requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/test-local-onnx.py
      - run: python -m pytest services/imaging-ai/test_r231.py services/imaging-ai/test_browser_reference.py -q
      - run: bash -n scripts/start-local-lungmask.sh scripts/test-r231-browser.sh
