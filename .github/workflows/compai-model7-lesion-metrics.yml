name: CompAI Model7 lesion-level evaluation contract
on:
  pull_request:
    paths:
      - scripts/score-compai-model7-lesions.py
      - scripts/test-score-compai-model7-lesions.py
      - .github/workflows/compai-model7-lesion-metrics.yml
permissions:
  contents: read
jobs:
  lesion-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'scipy<2' 'nibabel<6'
      - run: python -m py_compile scripts/score-compai-model7-lesions.py scripts/test-score-compai-model7-lesions.py
      - run: python scripts/test-score-compai-model7-lesions.py
