name: TotalSegmentator real weights provisioning (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-public-weights:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download official research model archives
        run: |
          python scripts/fetch-totalsegmentator-weights.py \
            --research-download --output "${RUNNER_TEMP}/opus-archives"
      - name: Provision actual model files from both archives
        run: |
          python scripts/provision-totalsegmentator-weights.py \
            --archives "${RUNNER_TEMP}/opus-archives" \
            --destination "${RUNNER_TEMP}/opus-installed-models" \
            --research-provision
      - name: Verify actual extracted metadata and checkpoint files
        run: |
          python scripts/verify-totalsegmentator-provision.py \
            --weights-root "${RUNNER_TEMP}/opus-installed-models"
      - name: Remove all temporary weights
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/opus-archives" "${RUNNER_TEMP}/opus-installed-models"
