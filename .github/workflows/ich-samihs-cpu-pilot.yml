name: ICH bounded CPU SAMIHS pilot safety and native-grid contracts

on:
  pull_request:
    paths:
      - "scripts/run-ich-samihs-cpu-pilot.py"
      - "scripts/samihs-verified-cpu-bootstrap.py"
      - "scripts/test-ich-samihs-cpu-pilot.py"
      - "scripts/select-ich-zenodo-sah-case.py"
      - "scripts/test-select-ich-zenodo-sah-case.py"
      - ".github/workflows/ich-samihs-real-zenodo-cpu.yml"
      - ".github/workflows/ich-samihs-cpu-pilot.yml"
  push:
    paths:
      - "scripts/run-ich-samihs-cpu-pilot.py"
      - "scripts/samihs-verified-cpu-bootstrap.py"
      - "scripts/test-ich-samihs-cpu-pilot.py"
      - "scripts/select-ich-zenodo-sah-case.py"
      - "scripts/test-select-ich-zenodo-sah-case.py"
      - ".github/workflows/ich-samihs-real-zenodo-cpu.yml"
      - ".github/workflows/ich-samihs-cpu-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-public-cpu-admission-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install limited geometry and numerical dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.2.6 scipy==1.15.3 nibabel==5.3.2
      - name: Compile real-data CPU pilot and safety contracts
        run: python -m py_compile scripts/run-ich-samihs-cpu-pilot.py scripts/samihs-verified-cpu-bootstrap.py scripts/test-ich-samihs-cpu-pilot.py scripts/select-ich-zenodo-sah-case.py scripts/test-select-ich-zenodo-sah-case.py
      - name: Verify source-preserving crop and nonpatient admission (NO pretrained inference)
        run: |
          python scripts/test-ich-samihs-cpu-pilot.py
          python scripts/test-select-ich-zenodo-sah-case.py
