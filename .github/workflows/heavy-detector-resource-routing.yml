name: Heavy CT detector resource admission
on:
  pull_request:
    paths:
      - services/imaging-ai/heavy_detector_router.py
      - .github/workflows/heavy-detector-resource-routing.yml
permissions:
  contents: read
jobs:
  fail-closed-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile services/imaging-ai/heavy_detector_router.py
      - run: python services/imaging-ai/heavy_detector_router.py
