name: CompAI LNQ original model runner contract
on:
  pull_request:
    paths:
      - scripts/run-compai-mediastinal-lnq-model7.py
      - scripts/lungscape191_streaming_components.py
      - .github/workflows/compai-lnq-original-contract.yml
permissions:
  contents: read
jobs:
  compai-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/run-compai-mediastinal-lnq-model7.py
      - run: python scripts/run-compai-mediastinal-lnq-model7.py --help
      - name: Assert original binary-mask localization uses bounded native coordinates
        run: |
          python - <<'PY'
          from pathlib import Path
          content=Path("scripts/run-compai-mediastinal-lnq-model7.py").read_text()
          assert "inspect_streaming_components(source, path" in content
          assert '"sourceNativeLocalizationVerified": True' in content
          assert '"originalMaskComponents": candidate_regions' in content
          assert '"clinicalValidation": False' in content
          print("PASS: original model source-bound components contract")
          PY
      - name: Ensure safe CPU device selection and honest physical-volume units
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("scripts/run-compai-mediastinal-lnq-model7.py").read_text()
          assert 'choices=("cpu","cuda"), default="cpu"' in source
          assert 'sourceMillimetresVerified' in source
          assert 'if mm_verified else None' in source
          assert 'for k in range(image.shape[2])' in source
          print("PASS: bounded CPU, slice counting, and unknown-units safeguards")
          PY
