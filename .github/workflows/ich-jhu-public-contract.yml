name: ICH public JHU source admission (no real model)
on:
  pull_request:
    paths:
      - "scripts/prepare-jhu-public-head-ich.py"
      - "scripts/test-prepare-jhu-public-head-ich.py"
      - "scripts/run-ianpan-ich-research.py"
      - ".github/workflows/ich-jhu-public-contract.yml"
  push:
    paths:
      - "scripts/prepare-jhu-public-head-ich.py"
      - "scripts/test-prepare-jhu-public-head-ich.py"
      - "scripts/run-ianpan-ich-research.py"
      - ".github/workflows/ich-jhu-public-contract.yml"
permissions:
  contents: read
jobs:
  public-hu-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir "numpy==2.2.6" "nibabel==5.3.2"
      - run: python -m py_compile scripts/prepare-jhu-public-head-ich.py scripts/test-prepare-jhu-public-head-ich.py scripts/run-ianpan-ich-research.py
      - run: python scripts/test-prepare-jhu-public-head-ich.py
  real-public-jhu-source-admission:
    needs: public-hu-evidence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir "numpy==2.2.6" "nibabel==5.3.2"
      - name: Admit one actual publisher MD5-bound public JHU NCCT (NO model or weights)
        run: |
          python scripts/prepare-jhu-public-head-ich.py --out-folder "$RUNNER_TEMP/opus-jhu-real-source"
      - name: Delete all downloaded CT pixels
        if: always()
        run: rm -rf "$RUNNER_TEMP/opus-jhu-real-source"
  probe-published-figshare-ich-ct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve public Figshare original CT packages WITHOUT downloading image bytes
        run: |
          python - <<'PY'
          import json, urllib.request
          url="https://api.figshare.com/v2/articles/23957937"
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"OpusRadiologyPublicResearch/1.0","Accept":"application/json"}),timeout=30) as resp:
                  data=json.load(resp)
              print("FIGSHARE_LICENSE:",data.get("license"))
              print("ARTICLE_ID:",data.get("id"))
              print("FIGSHARE_FILES_METADATA_ONLY:",json.dumps([{
                   "id":f.get("id"),"name":f.get("name"),"size":f.get("size"),
                   "is_link_only":f.get("is_link_only"),
                   "computed_md5":f.get("computed_md5") or f.get("supplied_md5"),
                   "download_url":f.get("download_url")}
                   for f in data.get("files",[])],ensure_ascii=False))
          except Exception as ex:
              raise RuntimeError("public_figshare_metadata_unavailable:"+type(ex).__name__) from ex
          PY
  probe-figshare-range-ct-package:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check byte-range capability and ZIP tail of LICENSED public Figshare archive
        run: |
          python - <<'PY'
          import urllib.request
          url="https://ndownloader.figshare.com/files/63081925"
          size=1300209108
          request=urllib.request.Request(url,headers={
              "User-Agent":"OpusRadiologyPublicResearch/1.0",
              "Range":f"bytes={size-4096}-{size-1}"})
          with urllib.request.urlopen(request,timeout=50) as resp:
              print("RANGE_HTTP_STATUS",resp.status)
              print("CONTENT_RANGE",resp.headers.get("Content-Range"))
              print("CONTENT_LENGTH",resp.headers.get("Content-Length"))
              raw=resp.read(4097)
              print("TAIL_BYTES",len(raw))
              if resp.status!=206 or len(raw)!=4096:
                  raise RuntimeError("figshare_does_not_support_safe_zip_ranged_reads")
              print("ZIP_EOCD_FOUND",raw.rfind(b'PK'+bytes((5,6)))>=0)
              assert raw.rfind(b'PK'+bytes((5,6)))>=0,"Unexpected archive tail without ZIP EOCD"
          PY
  inspect-figshare-zip-central-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read only public ZIP central-directory metadata, no CT pixels
        run: |
          python - <<'PY'
          import urllib.request,struct,hashlib,json
          url="https://ndownloader.figshare.com/files/63081925"
          size=1300209108
          def get_range(start,end):
              req=urllib.request.Request(url,headers={
                "User-Agent":"OpusRadiologyPublicResearch/1.0",
                "Range":f"bytes={start}-{end}"})
              with urllib.request.urlopen(req,timeout=60) as f:
                  chunk=f.read(4194305)
                  assert f.status==206 and f.headers["Content-Range"]==f"bytes {start}-{end}/{size}" and len(chunk)==end-start+1
                  return chunk
          tail=get_range(size-65536,size-1)
          e=tail.rfind(b'PK'+bytes((5,6)))
          assert e>=0,"ZIP footer missing"
          sig,disk,cddisk,diskcount,total,csize,offset,comment=struct.unpack_from("<4s4H2LH",tail,e)
          assert disk==cddisk==0 and 1<=total<=30000 and 46<=csize<=4194304
          raw=get_range(offset,offset+csize-1)
          entries=[];pos=0
          for i in range(total):
              values=struct.unpack_from("<4s6H3L5H2L",raw,pos)
              signature=values[0]
              assert signature==b'PK'+bytes((1,2)),"Invalid ZIP index signature"
              method=values[4];compressed=values[8];uncompressed=values[9]
              flen,exlen,clen=values[10:13]
              offsetlocal=values[-1]
              name=raw[pos+46:pos+46+flen].decode("utf-8")
              entries.append((name,compressed,uncompressed,method,offsetlocal))
              pos+=46+flen+exlen+clen
          assert pos==csize
          print("ZIP_ENTRIES",len(entries))
          from collections import Counter
          print("ZIP_EXTENSIONS",Counter(name.lower().rsplit(".",1)[-1] for name,*_ in entries))
          valid=[]
          for name,compressed,uncompressed,method,local in entries:
              if name.lower().endswith((".nii",".nii.gz",".nrrd")):
                  valid.append({"filenameHash":hashlib.sha256(name.encode()).hexdigest()[:16],
                      "basename":name.rsplit("/",1)[-1][:80],
                      "compressed":compressed,"uncompressed":uncompressed,
                      "method":method,"localOffset":local})
          print("CT_NIFTI_MEMBERS_FIRST_30",json.dumps(valid[:30]))
          print("CT_NIFTI_MEMBER_COUNT",len(valid))
          PY
