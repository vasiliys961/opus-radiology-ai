name: ICH public JHU source admission (no real model)
on:
  pull_request:
    paths:
      - "scripts/prepare-jhu-public-head-ich.py"
      - "scripts/test-prepare-jhu-public-head-ich.py"
      - "scripts/run-ianpan-ich-research.py"
      - ".github/workflows/ich-jhu-public-contract.yml"
  push:
    paths:
      - "scripts/prepare-jhu-public-head-ich.py"
      - "scripts/test-prepare-jhu-public-head-ich.py"
      - "scripts/run-ianpan-ich-research.py"
      - ".github/workflows/ich-jhu-public-contract.yml"
permissions:
  contents: read
jobs:
  public-hu-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir "numpy==2.2.6" "nibabel==5.3.2"
      - run: python -m py_compile scripts/prepare-jhu-public-head-ich.py scripts/test-prepare-jhu-public-head-ich.py scripts/run-ianpan-ich-research.py
      - run: python scripts/test-prepare-jhu-public-head-ich.py
