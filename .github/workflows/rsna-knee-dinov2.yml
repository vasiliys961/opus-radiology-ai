name: Knee DINOv2 research contract
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_dinov2.py'
      - 'services/imaging-ai/test_rsna_knee_dinov2.py'
      - '.github/workflows/rsna-knee-dinov2.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline compile and tests
        run: |
          python -m py_compile services/imaging-ai/rsna_knee_dinov2.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_dinov2.py' -v
