name: Web checks

on:
  push:
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/web-checks.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: DICOM module tests
        run: npm test
      - name: Test real offline ONNX CPU inference (synthetic weights only)
        run: |
          python3 -m pip install --disable-pip-version-check numpy onnxruntime onnx
          python3 ../scripts/test-local-onnx.py
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Synthetic DICOM browser check
        run: npm run test:browser
      - name: Synthetic native NIfTI CT and abdominal mask browser check
        run: node ../scripts/check-nifti-ct-browser.mjs
      - name: Local provider diagnostics smoke check (synthetic secrets only)
        run: node ../scripts/check-provider-readiness-dev.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-segmentation-browser
          path: web/browser-results/
          if-no-files-found: ignore
          retention-days: 7
