name: RSNA knee label preparation tests
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_label_prep.py'
      - 'services/imaging-ai/test_rsna_knee_label_prep.py'
      - '.github/workflows/rsna-knee-labels.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract tests
        run: |
          python -m py_compile services/imaging-ai/rsna_knee_label_prep.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_label_prep.py' -v
