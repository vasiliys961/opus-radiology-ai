name: ILD pattern engine web validation
on:
  pull_request:
    paths:
      - "web/lib/ild-pattern-engine*"
      - "web/components/IldPatternResearch.tsx"
      - "web/app/viewer/page.tsx"
      - ".github/workflows/ild-pattern-engine.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test lib/ild-pattern-engine.test.ts
