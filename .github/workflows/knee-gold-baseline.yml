name: Knee gold baseline planner
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_gold_baseline.py'
      - 'services/imaging-ai/test_rsna_knee_gold_baseline.py'
      - '.github/workflows/knee-gold-baseline.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd services/imaging-ai
          python -m unittest test_rsna_knee_gold_baseline.py -v
