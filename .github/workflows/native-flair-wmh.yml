name: Native FLAIR DICOM WMH model bridge
on:
  pull_request:
    paths:
      - "services/imaging-ai/mr_flair_dicom_to_nifti.py"
      - "services/imaging-ai/analyze_native_flair_wmh.py"
      - "services/imaging-ai/test_mr_flair_dicom_to_nifti.py"
      - ".github/workflows/native-flair-wmh.yml"
  push:
    paths:
      - "services/imaging-ai/mr_flair_dicom_to_nifti.py"
      - "services/imaging-ai/analyze_native_flair_wmh.py"
      - "services/imaging-ai/test_mr_flair_dicom_to_nifti.py"
      - ".github/workflows/native-flair-wmh.yml"
permissions:
  contents: read
jobs:
  native-mr-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.2.6 pydicom==3.0.1
      - run: |
          python -m py_compile services/imaging-ai/mr_flair_dicom_to_nifti.py services/imaging-ai/analyze_native_flair_wmh.py services/imaging-ai/test_mr_flair_dicom_to_nifti.py
          python services/imaging-ai/test_mr_flair_dicom_to_nifti.py
