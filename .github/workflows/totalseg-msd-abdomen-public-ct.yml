name: TotalSegmentator abdomen public MSD spleen CT (manual, research)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abdomen-public-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify research-host memory
        run: |
          python - <<'PY'
          from pathlib import Path
          memory={}
          for line in Path("/proc/meminfo").read_text().splitlines():
              if line.startswith(("MemTotal:","MemAvailable:")):
                  key,value,*_=line.split()
                  memory[key[:-1]]=int(value)*1024
          print("Linux memory GiB:",{k:round(v/1024**3,2) for k,v in memory.items()})
          assert memory["MemTotal"]>=14*1024**3
          assert memory["MemAvailable"]>=12*1024**3
          PY
      - name: Download official CC BY-SA 4.0 public MSD Task09 Spleen and verify published digest
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 30 \
            --max-time 1500 --output "$RUNNER_TEMP/Task09_Spleen.tar" \
            "https://msd-for-monai.s3-us-west-2.amazonaws.com/Task09_Spleen.tar"
          python -m pip install "numpy==1.26.4" "nibabel==5.3.2"
          python scripts/prepare-msd-spleen-abdomen.py \
            --archive "$RUNNER_TEMP/Task09_Spleen.tar" \
            --output "$RUNNER_TEMP/msd-abdomen-public"
          rm -f "$RUNNER_TEMP/Task09_Spleen.tar"
      - name: Obtain existing official open total-model weights
        run: |
          python scripts/fetch-totalsegmentator-weights.py \
            --research-download --output "$RUNNER_TEMP/archives"
          python scripts/provision-totalsegmentator-weights.py \
            --archives "$RUNNER_TEMP/archives" \
            --destination "$RUNNER_TEMP/models" --research-provision
          python scripts/verify-totalsegmentator-provision.py \
            --weights-root "$RUNNER_TEMP/models"
          find "$RUNNER_TEMP/models" -type d -exec chmod 755 {} +
          find "$RUNNER_TEMP/models" -type f -exec chmod 644 {} +
          rm -rf "$RUNNER_TEMP/archives"
      - name: Build isolated CPU TotalSegmentator container
        run: docker build -f deploy/Dockerfile.totalseg-research -t opus-totalseg-msd-abdomen .
      - name: Run actual trained model for spleen liver and kidneys (not a diagnosis)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          chmod 777 "$RUNNER_TEMP/out"
          timeout --signal=TERM --kill-after=20s 38m \
            python scripts/run-totalseg-first-inference.py \
              --input "$RUNNER_TEMP/msd-abdomen-public/public_abdomen_ct.nii" \
              --models "$RUNNER_TEMP/models" \
              --output "$RUNNER_TEMP/out" \
              --research-profile abdomen-four-organs \
              --research-confirmed \
            | tee "$RUNNER_TEMP/out/opus-abdomen-model-report.json"
      - name: Score spleen against independent original MSD expert annotation (kidneys/liver Dice unavailable)
        run: |
          python scripts/score-msd-spleen-abdomen.py \
            --reference "$RUNNER_TEMP/msd-abdomen-public" \
            --mask "$RUNNER_TEMP/out/totalseg_abdomen.nii" \
            --report "$RUNNER_TEMP/out/opus-abdomen-model-report.json"
      - name: Remove all public image volumes weights masks and reference labels
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/Task09_Spleen.tar" \
            "$RUNNER_TEMP/msd-abdomen-public" \
            "$RUNNER_TEMP/archives" "$RUNNER_TEMP/models" "$RUNNER_TEMP/out"
