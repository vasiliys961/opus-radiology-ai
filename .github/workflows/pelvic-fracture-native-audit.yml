name: Pelvic fracture native expert-audit contract
on:
  pull_request:
    paths:
      - "scripts/audit-pelvic-fracture-public-expert.py"
      - "scripts/test-audit-pelvic-fracture-public-expert.py"
      - ".github/workflows/pelvic-fracture-native-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-and-native-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded non-ML scientific requirements
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4" "nibabel==5.3.2" "scipy==1.15.3"
      - name: Check parser and provenance/geometry/label rejection
        run: |
          python -m py_compile scripts/audit-pelvic-fracture-public-expert.py
          python scripts/test-audit-pelvic-fracture-public-expert.py
      # All fixtures here are technical. No real pretrained model is tested.
