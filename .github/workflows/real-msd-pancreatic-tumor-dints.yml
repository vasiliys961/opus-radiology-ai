name: Genuine pancreatic tumor CT MONAI pretrained DiNTS on original expert MSD
on:
  pull_request:
    paths:
      - .github/workflows/real-msd-pancreatic-tumor-dints.yml
      - scripts/real-msd-pancreatic-tumor-dints.py
      - scripts/test-real-msd-pancreatic-tumor-dints.py
  push:
    branches: [main]
    paths:
      - .github/workflows/real-msd-pancreatic-tumor-dints.yml
      - scripts/real-msd-pancreatic-tumor-dints.py
      - scripts/test-real-msd-pancreatic-tumor-dints.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic-pancreas-pathology-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original trained MONAI pancreatic tumor task contract
        run: python -m unittest discover -s scripts -p 'test-real-msd-pancreatic-tumor-dints.py'
  trained-pancreatic-tumor-cpu:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HOME: /tmp/opus-pancreas-research-hf-cache
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Full public clinical source and memory gate
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          mem=int(next(line.split()[1] for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:")))*1024
          space=shutil.disk_usage(".").free
          print("Available GiB RAM",round(mem/2**30,1),"disk",round(space/2**30,1))
          assert mem>=6*2**30 and space>=8*2**30,"CPU host not safe for isolated full CT"
          PY
      - name: Install pinned CPU dependencies and official MONAI inference toolkit
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "monai==1.4.0" "numpy==1.26.4" "nibabel==5.3.2" "scipy==1.15.3" "huggingface_hub==0.34.4"
      - name: Download ORIGINAL annotated MSD pancreas tumor CT + official MONAI pretrained TorchScript
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 570s \
            python scripts/real-msd-pancreatic-tumor-dints.py \
              --mode prepare --dir "$RUNNER_TEMP/pancreatic-tumor-actual-source"
      - name: True pretrained MONAI DiNTS 3-class full CT inference without any original tumor-mask hints
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 2400s \
            python scripts/real-msd-pancreatic-tumor-dints.py \
              --mode infer \
              --dir "$RUNNER_TEMP/pancreatic-tumor-actual-source" \
              --output /tmp/opus-real-pancreatic-tumor-numeric.json
      - name: Upload ONLY numeric true-model-vs-expert results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-monai-pancreatic-tumor-public-numeric
          path: /tmp/opus-real-pancreatic-tumor-numeric.json
          if-no-files-found: error
          retention-days: 14
      - name: Always remove CT, expert mask, model files and HF cache
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pancreatic-tumor-actual-source" \
            /tmp/opus-real-pancreatic-tumor-numeric.json "$HF_HOME"
