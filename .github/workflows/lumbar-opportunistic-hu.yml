name: Spine L1-L5 original native CT HU research
on:
  pull_request:
    paths:
      - scripts/real-lumbar-opportunistic-native-ct-hu.py
      - scripts/test-real-lumbar-opportunistic-native-ct-hu.py
      - .github/workflows/lumbar-opportunistic-hu.yml
  push:
    branches: [main]
    paths:
      - scripts/real-lumbar-opportunistic-native-ct-hu.py
      - scripts/test-real-lumbar-opportunistic-native-ct-hu.py
      - .github/workflows/lumbar-opportunistic-hu.yml
permissions:
  contents: read
jobs:
  bone-source-HU-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lightweight numerical axial physical HU dependencies only
        run: python3 -m pip install 'numpy==1.26.4' 'nibabel==5.3.2' 'scipy==1.15.3'
      - run: python3 -m unittest discover -s scripts -p 'test-real-lumbar-opportunistic-native-ct-hu.py'
