name: RSNA knee second encoder and ensemble
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_coatnet.py'
      - 'services/imaging-ai/rsna_knee_ensemble.py'
      - 'services/imaging-ai/test_rsna_knee_ensemble.py'
      - '.github/workflows/rsna-knee-ensemble.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test no GPU or restricted data
        run: |
          python -m py_compile services/imaging-ai/rsna_knee_coatnet.py services/imaging-ai/rsna_knee_ensemble.py
          python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_ensemble.py' -v
