name: Colon cancer VISTA3D source-bound research

on:
  pull_request:
    paths:
      - 'scripts/real-public-msd-colon-vista3d.py'
      - 'scripts/test-real-public-msd-colon-vista3d.py'
      - '.github/workflows/real-msd-colon-vista3d.yml'
      - 'docs/MSD_COLON_CANCER_REAL_PRETRAINED.md'
  workflow_dispatch:
    inputs:
      run_gpu:
        description: 'EXPLICIT noncommercial research GPU inference (not on Mac)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect real-inference Python syntax and negative guards
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          python -m py_compile scripts/real-public-msd-colon-vista3d.py
          python scripts/test-real-public-msd-colon-vista3d.py

  real-original-model:
    # Never run a large 872MB NVIDIA-noncommercial model on ordinary CI/8GB Mac.
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu == true
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 240
    needs: source-contract
    steps:
      - uses: actions/checkout@v4
      - name: Perform actual original pretrained model inference on public expert CT
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_OFFLINE: '0'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            'monai[ignite]==1.5.0' 'huggingface_hub>=0.26,<2' \
            'numpy>=1.26,<3' 'nibabel>=5.2,<6' 'scipy>=1.12,<2'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          python3 scripts/real-public-msd-colon-vista3d.py --mode all \
            --work "$work/cancer" --report "$work/result.json"
          python3 - "$work/result.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['realOfficialPretrainedInference'] is True
          assert j['sourceBoundVoxelGrid'] and not j['patientUseAllowed']
          print(json.dumps({k:j[k] for k in ('task','case','TP','FP','FN','voxelDice','clinicalValidation')}))
          PY
          # No raw CT/weights/predicted voxel masks, identifiers or PHI uploaded.
