name: Native chest DICOM to MONAI HU volume
on:
  pull_request:
    paths:
      - "services/imaging-ai/chest_dicom_to_monai.py"
      - "services/imaging-ai/test_chest_dicom_to_monai.py"
      - ".github/workflows/native-chest-dicom-monai.yml"
  push:
    paths:
      - "services/imaging-ai/chest_dicom_to_monai.py"
      - "services/imaging-ai/test_chest_dicom_to_monai.py"
      - ".github/workflows/native-chest-dicom-monai.yml"
permissions:
  contents: read
jobs:
  original-hu-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.2.6 pydicom==3.0.1
      - run: |
          python -m py_compile services/imaging-ai/chest_dicom_to_monai.py services/imaging-ai/test_chest_dicom_to_monai.py
          python services/imaging-ai/test_chest_dicom_to_monai.py
