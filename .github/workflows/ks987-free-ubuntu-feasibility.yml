name: KS987 free Ubuntu runner genuine forward feasibility
on:
  push:
    paths:
      - .github/workflows/ks987-free-ubuntu-feasibility.yml
      - services/imaging-ai/ks987_native_kidney_executor.py
      - services/imaging-ai/test_ks987_native_kidney_executor.py
  pull_request:
    paths:
      - .github/workflows/ks987-free-ubuntu-feasibility.yml
permissions:
  contents: read
jobs:
  ks987-free-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host memory and free capacity, no artificial positive claims
        run: |
          python - <<'PY'
          import json,os,platform
          lines=open("/proc/meminfo").read().splitlines()
          mem={k:int(v.split()[0])*1024 for k,v in (line.split(":",1) for line in lines if ":" in line)}
          free=mem["MemAvailable:"]/(1024**3)
          total=mem["MemTotal:"]/(1024**3)
          result={"schema":"opus-ks987-free-runner-feasibility/v1",
             "host":platform.platform(),"memoryTotalGiB":round(total,2),
             "memoryAvailableGiB":round(free,2),"originalForwardMinimumFreeGiB":64,
             "fullVolumeOriginalForwardAdmissible":free>=64,
             "originalPublisherCheckpointInstalled":False,
             "genuineModelForwardExecuted":False}
          print(json.dumps(result,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## KS987 free runner feasibility\n\n")
              for k,v in result.items():f.write(f"- **{k}**: {v}\n")
          PY
      - name: Compile original executor and run real source-admission tests
        run: |
          python -m py_compile scripts/pancancer_lung_kidney_research.py services/imaging-ai/ks987_native_kidney_executor.py
          cd services/imaging-ai
          python -m unittest -v test_ks987_native_kidney_executor.py
      - name: Verify honest >=64GiB refusal before expensive inference
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("ks","scripts/pancancer_lung_kidney_research.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          free=mod.available_gib()
          print(f"KS987 original executor measured MemAvailable: {free:.2f} GiB")
          if free < mod.MIN_AVAILABLE_GIB:
              print("EXPECTED: original KS987 full forward NOT ADMISSIBLE on this free runner (requires >=64 GiB).")
          else:
              print("Memory threshold passed; original weight/trainer/source provisioning still needed before genuine forward.")
          PY
