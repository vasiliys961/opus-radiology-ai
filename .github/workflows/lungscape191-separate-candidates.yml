name: LungSCAPE native separated candidate coordinates
on:
  pull_request:
    paths:
      - "scripts/lungscape191_lesion_components.py"
      - "scripts/test_lungscape191_lesion_components.py"
      - "scripts/run-lungscape191-research.py"
      - ".github/workflows/lungscape191-separate-candidates.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install nibabel==5.3.2 numpy==2.2.6 scipy==1.15.3
      - run: python -m unittest discover -s scripts -p test_lungscape191_lesion_components.py -v
      - run: python -m py_compile scripts/run-lungscape191-research.py scripts/lungscape191_lesion_components.py
