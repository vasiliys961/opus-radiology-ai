name: Abdominal original CT pathology task contracts
on:
  pull_request:
    paths:
      - "services/imaging-ai/abdominal_ct_pathology_inference.py"
      - "services/imaging-ai/test_abdominal_ct_pathology_inference.py"
      - ".github/workflows/abdominal-ct-pathology-contract.yml"
  push:
    paths:
      - "services/imaging-ai/abdominal_ct_pathology_inference.py"
      - "services/imaging-ai/test_abdominal_ct_pathology_inference.py"
      - ".github/workflows/abdominal-ct-pathology-contract.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight source-grid libraries only
        run: python -m pip install numpy==2.2.6 nibabel==5.3.2
      - name: Check syntax and synthetic-only interface contracts
        working-directory: services/imaging-ai
        run: |
          python -m py_compile abdominal_ct_pathology_inference.py test_abdominal_ct_pathology_inference.py
          python test_abdominal_ct_pathology_inference.py
