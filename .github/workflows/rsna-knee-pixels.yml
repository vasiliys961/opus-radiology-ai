name: Knee MRI pixel preprocessing
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee.py'
      - 'services/imaging-ai/rsna_knee_dinov2.py'
      - 'services/imaging-ai/rsna_knee_coatnet.py'
      - 'services/imaging-ai/rsna_knee_dinov2_predict.py'
      - 'services/imaging-ai/rsna_knee_coatnet_predict.py'
      - 'services/imaging-ai/rsna_knee_compare.py'
      - 'services/imaging-ai/test_rsna_knee_pixels.py'
      - '.github/workflows/rsna-knee-pixels.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy
      - run: |
          python -m py_compile services/imaging-ai/rsna_knee.py services/imaging-ai/rsna_knee_dinov2.py services/imaging-ai/rsna_knee_coatnet.py services/imaging-ai/rsna_knee_compare.py services/imaging-ai/rsna_knee_dinov2_predict.py services/imaging-ai/rsna_knee_coatnet_predict.py
          PYTHONPATH=services/imaging-ai python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_pixels.py' -v
