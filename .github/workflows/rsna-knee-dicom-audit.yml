name: Knee DICOM input quality checks
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_dicom_audit.py'
      - 'services/imaging-ai/test_rsna_knee_dicom_audit.py'
      - '.github/workflows/rsna-knee-dicom-audit.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pydicom
      - run: |
          python -m py_compile services/imaging-ai/rsna_knee_dicom_audit.py
          PYTHONPATH=services/imaging-ai python -m unittest discover -s services/imaging-ai -p 'test_rsna_knee_dicom_audit.py' -v
