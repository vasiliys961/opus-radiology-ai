name: CT HU rescale metadata research contract
on:
  pull_request:
    paths:
      - web/lib/dicom-series.ts
      - web/lib/dicom-series.test.ts
      - web/lib/ct-hu-calibration.ts
      - web/lib/ct-hu-calibration.test.ts
      - web/lib/cpu-lung-laa950.ts
      - web/lib/cpu-lung-laa950.test.ts
      - web/components/CornerstoneMPR.tsx
      - web/components/SegmentationControls.tsx
      - web/app/page.tsx
      - .github/workflows/ct-hu-calibration-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hu-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Real DICOM reader + source-bound HU acceptance contracts (synthetic headers)
        working-directory: web
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test lib/dicom-series.test.ts lib/ct-hu-calibration.test.ts lib/cpu-lung-laa950.test.ts
      # No real patient DICOM or model inference; never claim decoded HU checked here.
