name: Original FracSegNet pelvic fracture model research contract
on:
  pull_request:
    paths:
      - scripts/real-fracsegnet-v1-pelvic-fracture-gpu.py
      - scripts/test-real-fracsegnet-v1-pelvic-fracture-gpu.py
      - .github/workflows/real-fracsegnet-v1-pelvic-fracture-gpu.yml
  push:
    branches: [main]
    paths:
      - scripts/real-fracsegnet-v1-pelvic-fracture-gpu.py
      - scripts/test-real-fracsegnet-v1-pelvic-fracture-gpu.py
      - .github/workflows/real-fracsegnet-v1-pelvic-fracture-gpu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fracture-network-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original vendor model ROI and GPU guard without simulated trained inference
        run: |
          python3 -m pip install 'numpy==2.2.6' 'nibabel==5.3.2' 'scipy==1.15.3'
          python3 -m unittest discover -s scripts -p 'test-real-fracsegnet-v1-pelvic-fracture-gpu.py'
# Actual original FracSegNet v1 model is vendor-distributed on Google Drive
# and requires >=10GB NVIDIA GPU, verified rights and a separate pre-extracted
# public ROI. No production/ordinary GitHub hosted 7GiB CPU inference.
