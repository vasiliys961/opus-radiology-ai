name: Task315 research inference contract
on:
  pull_request:
    paths:
      - "services/imaging-ai/effusion_inference.py"
      - "services/imaging-ai/test_effusion_inference.py"
      - ".github/workflows/task315-research-bridge.yml"
  push:
    paths:
      - "services/imaging-ai/effusion_inference.py"
      - "services/imaging-ai/test_effusion_inference.py"
      - ".github/workflows/task315-research-bridge.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only lightweight mathematical dependencies
        run: python -m pip install numpy==2.2.6 nibabel==5.3.2
      - name: Technical execution contract (mock medical model only)
        working-directory: services/imaging-ai
        run: |
          python -m py_compile effusion_inference.py test_effusion_inference.py
          python test_effusion_inference.py
