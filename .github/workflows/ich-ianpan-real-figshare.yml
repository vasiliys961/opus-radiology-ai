name: REAL pretrained ICH on original public hemorrhagic CT (CPU)
on:
  pull_request:
    paths:
      - ".github/workflows/ich-ianpan-real-figshare.yml"
      - "scripts/run-ianpan-ich-research.py"
      - "scripts/test-ianpan-figshare-source.py"
      - "scripts/prepare-figshare-ich-public.py"
      - "scripts/ianpan_source_roi.py"
permissions:
  contents: read
jobs:
  research-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --no-cache-dir "numpy==2.2.6" "nibabel==5.3.2"
      - run: python -m py_compile scripts/run-ianpan-ich-research.py scripts/test-ianpan-figshare-source.py
      - run: python scripts/test-ianpan-figshare-source.py

  genuine-public-ich-cpu:
    needs: research-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: RAM and disk resource admission before public CT or pretrained checkpoint
        run: |
          python - <<'PY'
          import os, shutil
          available=os.sysconf("SC_AVPHYS_PAGES")*os.sysconf("SC_PAGE_SIZE")
          free=shutil.disk_usage(".").free
          print("Worker capacity GiB",round(available/1024**3,2),round(free/1024**3,2))
          assert available>=10*1024**3,"Insufficient memory for real CT inference"
          assert free>=9*1024**3,"Insufficient scratch space"
          PY
      - name: CPU PyTorch and pinned ORIGINAL ianpan model requirements
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir \
            "numpy==2.2.6" "opencv-python-headless==4.11.0.86" \
            "safetensors==0.7.0" "timm==1.0.27" "einops==0.8.1" \
            "nibabel==5.3.2" "pydicom==3.0.1" \
            "huggingface-hub==1.23.0" "psutil==6.1.1"
          python -m pip install --no-cache-dir --no-deps \
            "git+https://github.com/i-pan/ct-head-hemorrhage-detection.git@098b7ff"
      - name: Read only ONE real CC BY Figshare hemorrhagic CT, authenticate original HU-like pixel geometry
        run: |
          python scripts/prepare-figshare-ich-public.py --out-folder "$RUNNER_TEMP/opus-public-ich"
      - name: Run REAL pinned pretrained ICH classifier AND segmenter on original CT
        run: |
          python scripts/run-ianpan-ich-research.py \
            --source "$RUNNER_TEMP/opus-public-ich/public-original-head-ct-hu-like.nii" \
            --manifest "$RUNNER_TEMP/opus-public-ich/public-source-evidence.json" \
            --model-dir "$RUNNER_TEMP/opus-verified-ich-weights" \
            --output "$RUNNER_TEMP/opus-real-ich-public-report.json" \
            --device cpu --download-pretrained
      - name: Upload numeric source-bound research candidates (no CT pixels or checkpoint)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-pretrained-ich-figshare-original-ct
          path: ${{ runner.temp }}/opus-real-ich-public-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean public CT and weights even when processing fails
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/opus-public-ich" "$RUNNER_TEMP/opus-verified-ich-weights" "$RUNNER_TEMP/opus-real-ich-public-report.json"
