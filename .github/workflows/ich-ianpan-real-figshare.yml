name: REAL pretrained ICH inference on one published spontaneous hemorrhage NCCT
on:
  push:
    branches: [feature/ich-real-figshare-public-20261015]
    paths:
      - ".github/workflows/ich-ianpan-real-figshare.yml"
  workflow_dispatch:
    inputs:
      confirm_public_research:
        description: "Only fixed licensed public PHE-SICH-CT-IDS (type PUBLIC-ICH-RESEARCH-OK)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  real-public-ct-one-study:
    if: ${{ github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.confirm_public_research == 'PUBLIC-ICH-RESEARCH-OK') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Admit public CPU research runner before downloading CT or model
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          mem=os.sysconf("SC_AVPHYS_PAGES")*os.sysconf("SC_PAGE_SIZE")
          free=shutil.disk_usage(".").free
          print("public experimental research admission; available RAM GiB:",round(mem/1024**3,2),"free disk GiB:",round(free/1024**3,2))
          assert mem>=10*1024**3 and free>=9*1024**3,"No adequate approved research CPU resources"
          PY
      - name: Install publisher-pinned original model dependencies, CPU only
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir "torch==2.6.0" "torchvision==0.21.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "numpy==2.2.6" "opencv-python-headless==4.11.0.86" "safetensors==0.7.0" "timm==1.0.27" "einops==0.8.1" "nibabel==5.3.2" "pydicom==3.0.1" "huggingface-hub==1.23.0" "psutil==6.1.1"
          python -m pip install --no-cache-dir --no-deps "git+https://github.com/i-pan/ct-head-hemorrhage-detection.git@098b7ff"
          python -m pip check
      - name: Admit ONE true published public CT from 1.3 GB ZIP via two indexed ranges plus bounded member
        run: |
          python scripts/prepare-figshare-ich-public.py --out-folder "$RUNNER_TEMP/opus-public-ich"
      - name: Run authentic checksum-gated ianpan pretrained classifier and ICH heatmaps on full original CT
        run: |
          python scripts/run-ianpan-ich-research.py \
            --source "$RUNNER_TEMP/opus-public-ich/public-original-head-ct-hu-like.nii" \
            --manifest "$RUNNER_TEMP/opus-public-ich/public-source-evidence.json" \
            --model-dir "$RUNNER_TEMP/opus-pinned-pretrained-ich-weights" \
            --output "$RUNNER_TEMP/opus-public-ich-model-research.json" \
            --device cpu --download-pretrained
      - name: Independently inspect completed numeric model report and provenance status
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"opus-public-ich-model-research.json"
          data=json.loads(p.read_text())
          assert data["schema"]=="opus-ianpan-genuine-public-ich-research/v1"
          assert data["model"]["checkpointSha256Verified"] is True
          assert data["source"]["publishedFigshareHuLikeWithoutOriginalDicomRescaleAudit"] is True
          assert data["source"]["sourceOriginalDicomHURescaleIndependentlyVerified"] is False
          assert data["source"]["referenceLabelsOnlyPerihematomalEdema"] is True
          assert data["externalExpertHemorrhageLocalizationComparisonPerformed"] is False
          assert data["readyForClinicalUse"] is False
          candidates=data["candidates"]
          print(json.dumps({"actualPretrainedInference":True,
             "sourceOnlyHUlike":True,"expertICHGroundTruthCompared":False,
             "modelOrderedSliceCount":data["source"]["modelOrderedSliceCount"],
             "candidateCountAtPoint5":len(candidates),
             "seriesRawUncalibratedScores":data["seriesRawUncalibratedScores"],
             "topFiveCandidates":sorted([{
                "class":x["class"],"sliceIndexModelOrdered":x["sliceIndexModelOrdered"],
                "rawUncalibratedScore":x["rawUncalibratedScore"],
                "hasModelInputRoi":x["modelInputBoundingBoxXY"] is not None
             } for x in candidates],key=lambda x:-x["rawUncalibratedScore"])[:5],
             "independentClinicalValidation":False,
          },ensure_ascii=False))
          PY
      - name: Publish research NUMBERS only (no original patient CT pixels)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-ich-model-output-figshare-single-public-ct
          path: ${{ runner.temp }}/opus-public-ich-model-research.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove original public CT, uncompressed pixels and pretrained weights
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/opus-public-ich" "$RUNNER_TEMP/opus-pinned-pretrained-ich-weights" "$RUNNER_TEMP/opus-public-ich-model-research.json"
