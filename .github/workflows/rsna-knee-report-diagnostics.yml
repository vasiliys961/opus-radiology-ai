name: Knee report audit diagnostics
on:
  pull_request:
    paths:
      - 'services/imaging-ai/rsna_knee_report_diagnostics.py'
      - 'services/imaging-ai/test_rsna_knee_report_diagnostics.py'
      - '.github/workflows/rsna-knee-report-diagnostics.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd services/imaging-ai
          python -m unittest test_rsna_knee_report_diagnostics.py -v
