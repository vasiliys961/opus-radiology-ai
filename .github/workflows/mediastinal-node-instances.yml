name: Mediastinal node candidates source geometry
on:
  pull_request:
    paths:
      - scripts/mediastinal_node_instances.py
      - scripts/real-raidionics-mediastinal-onnx-cpu.py
      - .github/workflows/mediastinal-node-instances.yml
permissions:
  contents: read
jobs:
  candidate-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3' 'scipy<2'
      - run: python -m py_compile scripts/mediastinal_node_instances.py scripts/real-raidionics-mediastinal-onnx-cpu.py
      - run: python scripts/mediastinal_node_instances.py
