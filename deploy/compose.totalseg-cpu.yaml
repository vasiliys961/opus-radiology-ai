# A separate CPU runtime probe. This has NO inference command or exposed endpoint.
services:
  totalseg-runtime-probe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.totalseg-cpu
    network_mode: none
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 4g
    cpus: "2.0"
    tmpfs:
      - /tmp:size=64m,mode=1777
    command: ["--check-only"]
    restart: "no"
